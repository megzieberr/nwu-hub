name: eFundi sync

# Four times daily: ~08:23, 12:23, 16:23, 19:23 SAST (UTC+2) = 06:23, 10:23, 14:23, 17:23 UTC.
# The midday runs exist for same-day class links — lecturers post the join link a few hours
# before an evening class, and a twice-daily cadence delivered it after the class had started
# (ENGV orientation, 2026-07-14). GitHub cron is best-effort: minute 0 is so congested that
# by 2026-08-27/28 whole runs were being DROPPED, not just delayed (one run in two days).
# The :23 offset keeps us off the peak minute, per GitHub's own docs. Treat all times as
# "no earlier than". workflow_dispatch = manual "Run workflow" button, for testing.
on:
  schedule:
    - cron: '23 6,10,14,17 * * *'
  workflow_dispatch: {}

# Least privilege: the worker talks to Supabase + eFundi, it does not touch the repo.
permissions:
  contents: read

# Never let two runs overlap (they'd both write the same rows).
concurrency:
  group: efundi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # supabase-js v2 needs Node 22+ (global WebSocket)
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - name: Install deps
        working-directory: sync
        run: npm ci --no-audit --no-fund   # lockfile-frozen, reproducible for an unattended job
      - name: Run sync
        working-directory: sync
        env:
          EFUNDI_USERNAME: ${{ secrets.EFUNDI_USERNAME }}
          EFUNDI_PASSWORD: ${{ secrets.EFUNDI_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: enables the announcements -> objectives agent. Absent = agent skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node index.js
