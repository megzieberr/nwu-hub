name: eFundi sync

# The real schedule lives in Supabase pg_cron (job 'nwu-hub-sync', see supabase/cron-sync.sql):
# four dispatches a day at 08:00, 12:00, 16:00, 19:00 SAST via workflow_dispatch, because
# GitHub's scheduler had decayed to dropping whole runs by late Aug 2026 (one run in two days),
# while pg_cron has never drifted. The single cron below is a safety net only — if the Supabase
# project is paused or its token dies, one late GitHub-scheduled run a day is better than none.
# Keep it to ONE slot: a second timer just queues behind the concurrency group and runs twice.
on:
  schedule:
    - cron: '0 5 * * *'    # 07:00 SAST — backstop; pg_cron drives the real four
  workflow_dispatch: {}

# Least privilege: the worker talks to Supabase + eFundi, it does not touch the repo.
permissions:
  contents: read

# Never let two runs overlap (they'd both write the same rows).
concurrency:
  group: efundi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # supabase-js v2 needs Node 22+ (global WebSocket)
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - name: Install deps
        working-directory: sync
        run: npm ci --no-audit --no-fund   # lockfile-frozen, reproducible for an unattended job
      - name: Run sync
        working-directory: sync
        env:
          EFUNDI_USERNAME: ${{ secrets.EFUNDI_USERNAME }}
          EFUNDI_PASSWORD: ${{ secrets.EFUNDI_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: enables the announcements -> objectives agent. Absent = agent skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node index.js
